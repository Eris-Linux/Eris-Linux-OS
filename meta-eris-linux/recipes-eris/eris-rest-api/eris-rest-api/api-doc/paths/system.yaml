kernel:
  get:
    summary: Get the kernel version number.
    tags: [ System ]
    responses:
      '200':
        description: Kernel version of the board (for example `6.6.63-v8-16k`)
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error looking for kernel version.
        content:
          text/plain:
            schema:
              type: string

model:
  get:
    summary: Get the model of the board.
    tags: [ System ]
    responses:
      '200':
        description: Model of the board (for example `Raspberry-Pi-4`)
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error looking for system model.
        content:
          text/plain:
            schema:
              type: string

type:
  get:
    summary: Get the type of the system image.
    tags: [ System ]
    responses:
      '200':
        description: Type (`Graphical` or `Headless`) of the system image.
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error looking for system type.
        content:
          text/plain:
            schema:
              type: string

uuid:
  get:
    summary: Get the UUID of the device.
    tags: [ System ]
    responses:
      '200':
        description: Universally Unique Identifier of the device (128-bits formatted as `27d8494b-8c15-4984-828a-92ef8295f979`).
        content:
          text/plain:
            schema:
              type: string
      '404':
        description: No system UUID defined yet.
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error accessing system UUID.
        content:
          text/plain:
            schema:
              type: string

version:
  get:
    summary: Get the version the system.
    tags: [ System ]
    responses:
      '200':
        description: System version number (formatted as `1.2.3`)
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error accessing system version.
        content:
          text/plain:
            schema:
              type: string


status:
  get:
    summary: Get the update status the system.
    tags: [ System ]
    responses:
      '200':
        description: update status ("1 System OK.", "2 System update install in progress.", "3 System update install Ok.", "4 System update install failed.", "5 System reboot in progress."
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error accessing system update status.
        content:
          text/plain:
            schema:
              type: string

