status:
  get:
    summary: Get the update system status.
    tags: [ Update ]
    responses:
      '200':
        description: One of `1 System Ok`, `2 System update install in progress.`, `3 System update install Ok.`, `4 System update install failed.`, `5 System reboot in progress.` 
        content:
          text/plain:
            schema:
              type: string

