count:
  get:
    summary: Get the maximal number of containers allowed.
    tags: [ Containers ]
    responses:
      '200':
        description: number of containers allowed.
        content:
          text/plain:
            schema:
              type: string

name:
  get:
    summary: Get the name of the container installed in a slot.
    tags: [ Containers ]
    parameters:
      - name: index
        in: query
        required: true
        description: Index of the slot (in [0-3]).
        schema:
          type: string
    responses:
      '200':
        description: Name of the container installed in the given slot, empty string if none.
        content:
          text/plain:
            schema:
              type: string
      '400':
        description: Missing or invalid slot `index` parameter (must be in [0-3]).
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error in container configuration.
        content:
          text/plain:
            schema:
              type: string

presence:
  get:
    summary: Get the presence of a container in a slot.
    tags: [ Containers ]
    parameters:
      - name: index
        in: query
        required: true
        description: Index of the slot (in [0-3]).
        schema:
          type: string
    responses:
      '200':
        description: State (`absent` or `present`) of a container in the slot.
        content:
          text/plain:
            schema:
              type: string
      '400':
        description: Missing or invalid slot `index` parameter (must be in [0-3]).
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error in container configuration.
        content:
          text/plain:
            schema:
              type: string

status:
  get:
    summary: Get the status of a container in a slot.
    tags: [ Containers ]
    parameters:
      - name: index
        in: query
        required: true
        description: Index of the slot ([0-3]).
        schema:
          type: string
    responses:
      '200':
        description: Status (`running` or `stopped`) of the container in the slot.
        content:
          text/plain:
            schema:
              type: string
      '400':
        description: Missing or invalid slot `index` parameter (must be in [0-3]).
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error in communication with docker.
        content:
          text/plain:
            schema:
              type: string

version:
  get:
    summary: Get the version of the container installed in a slot.
    tags: [ Containers ]
    parameters:
      - name: index
        in: query
        required: true
        description: Index of the slot (in [0-3]).
        schema:
          type: string
    responses:
      '200':
        description: Version of the container installed in the given slot, empty string if none.
        content:
          text/plain:
            schema:
              type: string
      '400':
        description: Missing or invalid slot `index` parameter (must be in [0-3]).
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error in container configuration.
        content:
          text/plain:
            schema:
              type: string

policy:
  get:
    summary: Get the policy for container update.
    tags: [ Containers ]
    responses:
      '200':
        description: Policy for container update (`immediate` or `atreboot`).
        content:
          text/plain:
            schema:
              type: string
  put:
    summary: Set the policy for container update.
    tags: [ Containers ]
    parameters:
      - name: policy
        in: query
        required: true
        description: Policy for the container update (`immediate` or `atreboot`).
        schema:
          type: string
    responses:
      '200':
        description: Ok
        content:
          text/plain:
            schema:
              type: string
      '400':
        description: Missing or invalid policy parameter (must be `immediate` or `atreboot`).
        content:
          text/plain:
            schema:
              type: string
      '500':
        description: Internal error when trying to save the policy.
        content:
          text/plain:
            schema:
              type: string

